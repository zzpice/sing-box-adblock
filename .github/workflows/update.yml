name: Update sing-box adblock rules

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1,4"

permissions:
  contents: read

concurrency:
  group: sing-box-adblock-${{ github.ref }}
  cancel-in-progress: false

env:
  SING_BOX_VERSION: "1.14.2"
  SING_BOX_SHA256: "a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
  publish:
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download verified sing-box
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sing-box.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 -o "$archive" "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/sing-box-$SING_BOX_VERSION-linux-amd64.tar.gz"
          printf '%s  %s\n' "$SING_BOX_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sing-box-$SING_BOX_VERSION-linux-amd64" >> "$GITHUB_PATH"
      - name: Build and validate artifacts
        run: python scripts/build.py
      - name: Publish changed artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- adblock.srs upstream-revision.txt)" ]]; then
            echo "Artifacts are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adblock.srs upstream-revision.txt
          git commit -m "chore: update adblock rules"
          git push
